name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sookmyung_map
          POSTGRES_USER: map_user
          POSTGRES_PASSWORD: map_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U map_user -d sookmyung_map"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test backend
        working-directory: NoonGill
        run: ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: NoonGill-front/package-lock.json

      - name: Build frontend
        working-directory: NoonGill-front
        env:
          VITE_NAVER_MAP_CLIENT_ID: ci-placeholder
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/noongill_deploy
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/noongill_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Package source
        run: |
          tar \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='**/build' \
            --exclude='**/dist' \
            -czf /tmp/noongill-${GITHUB_SHA}.tar.gz .

      - name: Upload release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/noongill_deploy \
            /tmp/noongill-${GITHUB_SHA}.tar.gz \
            "${EC2_USER}@${EC2_HOST}:/tmp/noongill-${GITHUB_SHA}.tar.gz"

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/noongill_deploy "${EC2_USER}@${EC2_HOST}" \
            "RELEASE_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir="/opt/noongill/releases/${RELEASE_SHA}"
          sudo mkdir -p "$release_dir" /opt/noongill/shared
          sudo tar -xzf "/tmp/noongill-${RELEASE_SHA}.tar.gz" -C "$release_dir"
          sudo ln -sfn "$release_dir" /opt/noongill/current
          cd /opt/noongill/current
          sudo docker compose \
            --env-file /opt/noongill/shared/.env.production \
            -f compose.prod.yml \
            up -d --build --remove-orphans
          rm -f "/tmp/noongill-${RELEASE_SHA}.tar.gz"
          REMOTE
