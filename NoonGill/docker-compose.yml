services:
  postgres:
    image: postgres:18
    container_name: sookmyung-map-db
    environment:
      POSTGRES_DB: sookmyung_map
      POSTGRES_USER: map_user
      POSTGRES_PASSWORD: map_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map_user -d sookmyung_map"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
